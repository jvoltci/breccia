site_name: breccia
site_description: A cross-framework block-scaled tensor primitive (FP8 / FP4 / MXFP8 / NVFP4 / INT4)
site_url: https://jvoltci.github.io/breccia/
repo_url: https://github.com/jvoltci/breccia
repo_name: jvoltci/breccia
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Recipes: recipes.md
  - Formats: formats.md
  - API reference: api.md
  - Bridges & migration: bridges.md
  - Kernels: kernels.md
  - Numerics: numerics.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - FAQ: faq.md
  - vLLM integration sketch: vllm-integration-sketch.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jvoltci/breccia
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/breccia/
