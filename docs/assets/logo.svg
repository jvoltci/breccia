<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Breccia: angular fragments cemented by a binding matrix -->
  <g fill="currentColor">
    <!-- Cementing matrix outline (thin frame) -->
    <rect x="2" y="2" width="44" height="44" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35" />

    <!-- Angular fragment shards (varied sizes, irregular polygons) -->
    <!-- Top-left fragment -->
    <polygon points="6,7 16,5 19,13 13,18 5,15" opacity="0.92" />
    <!-- Top-right fragment -->
    <polygon points="26,4 38,7 40,16 32,20 25,14" opacity="0.92" />
    <!-- Middle fragment -->
    <polygon points="14,21 24,19 27,28 19,32 12,28" opacity="0.92" />
    <!-- Right-middle fragment -->
    <polygon points="30,22 41,24 42,33 35,36 28,32" opacity="0.92" />
    <!-- Bottom-left fragment -->
    <polygon points="6,30 17,32 19,42 9,43 4,38" opacity="0.92" />
    <!-- Bottom-right fragment -->
    <polygon points="23,36 32,38 38,44 27,44 22,42" opacity="0.92" />
  </g>
</svg>
