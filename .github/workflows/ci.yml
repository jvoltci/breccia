name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install breccia with dev + torch + bridges extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,torch,bridges]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Run quickstart example
        run: python examples/01_quickstart.py

      - name: Run recipe-portable example
        run: python examples/02_recipe_portable_train.py

      - name: Run checkpoint example
        run: python examples/03_checkpoint_with_scale.py

      - name: Run TE migration example (graceful no-TE case)
        run: python examples/04_te_migration.py

      - name: Run memory benchmark
        run: python benchmarks/bench_memory.py

      - name: Run accuracy benchmark
        run: python benchmarks/bench_accuracy.py
